<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B站 / X / 抖音 / 小红书 / 小黑盒转 MP4</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 720px; margin: 12vh auto; padding: 0 20px; }
    main { border: 1px solid #8885; border-radius: 18px; padding: 28px; box-shadow: 0 16px 50px #0002; }
    h1 { margin-top: 0; } p { color: #888; }
    form { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 12px; border-radius: 9px; border: 1px solid #8888; }
    button, a.button { padding: 12px 18px; border: 0; border-radius: 9px; background: #00aeec; color: white; cursor: pointer; text-decoration: none; }
    #status { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body><main>
  <h1>B站 / X / 抖音 / 小红书 / 小黑盒转 MP4</h1>
  <p>粘贴 B 站、b23.tv、X、Twitter、抖音、小红书或小黑盒的公开视频链接。仅下载你有权保存和使用的内容。</p>
  <form id="form"><input id="url" type="url" required placeholder="https://x.com/user/status/..."><button>开始转换</button></form>
  <div id="status"></div>
</main><script>
const form = document.querySelector('#form'), out = document.querySelector('#status');
const POLL_TIMEOUT_MS = 60 * 60 * 1000;
const POLL_INTERVAL_MS = 1500;
const REQUEST_TIMEOUT_MS = 15000;
form.addEventListener('submit', async (event) => {
  event.preventDefault(); out.textContent = '正在创建任务…';
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  try {
    const response = await fetch('/api/jobs', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({url:document.querySelector('#url').value}), signal:controller.signal});
    const job = await response.json();
    if (!response.ok) { out.textContent = job.detail || '创建失败'; return; }
    if (!job.id) { out.textContent = '创建失败：服务器没有返回任务编号'; return; }
    await poll(job.id, Date.now() + POLL_TIMEOUT_MS);
  } catch (error) {
    out.textContent = error.name === 'AbortError' ? '创建任务超时，请稍后重试' : '无法连接视频服务，请稍后重试';
  } finally {
    clearTimeout(timer);
  }
});
async function poll(id, deadline) {
  if (Date.now() >= deadline) { out.textContent = '转换超时，请重新提交'; return; }
  const remaining = deadline - Date.now();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), Math.min(REQUEST_TIMEOUT_MS, remaining));
  try {
    const response = await fetch(`/api/jobs/${id}`, {signal:controller.signal});
    const job = await response.json();
    if (!response.ok) { out.textContent = job.detail || '状态查询失败'; return; }
    if (job.status === 'completed') { out.innerHTML = `转换完成：<a class="button" href="${job.download_url}">下载 MP4</a>`; return; }
    if (job.status === 'failed') { out.textContent = `失败：${job.error || '转换失败'}`; return; }
    out.textContent = job.status === 'queued' ? '任务排队中…' : '正在下载并合并音视频…';
  } catch (error) {
    if (Date.now() >= deadline) { out.textContent = '状态查询超时，请重新提交'; return; }
    out.textContent = error.name === 'AbortError' ? '状态查询超时，正在重试…' : '状态查询暂时失败，正在重试…';
  } finally {
    clearTimeout(timer);
  }
  const delay = Math.min(POLL_INTERVAL_MS, Math.max(0, deadline - Date.now()));
  if (delay > 0) {
    setTimeout(() => { void poll(id, deadline); }, delay);
  } else {
    out.textContent = '转换超时，请重新提交';
  }
}
</script></body></html>
